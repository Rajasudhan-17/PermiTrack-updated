services:
  - type: web
    name: permitrack-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*" # Replace with your Vercel frontend URL once deployed
      - key: AUTO_CREATE_TABLES
        value: "true"
      - key: REDIS_URL
        sync: false
